<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تيرا أفلام | TeraFlix</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  
  <style>
    :root {
      --bg-base: #070913;
      --card-bg: rgba(18, 24, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --text-dim: #94a3b8;
    }

    body.theme-cyan { --bg-base: #040d1a; --card-bg: rgba(10, 28, 54, 0.75); --accent: #06b6d4; --accent-glow: rgba(6, 182, 212, 0.35); }
    body.theme-crimson { --bg-base: #100609; --card-bg: rgba(38, 12, 20, 0.75); --accent: #f43f5e; --accent-glow: rgba(244, 63, 94, 0.35); }
    body.theme-emerald { --bg-base: #04120c; --card-bg: rgba(11, 38, 25, 0.75); --accent: #10b981; --accent-glow: rgba(16, 185, 129, 0.35); }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-base); color: #f8fafc; padding-bottom: 90px; user-select: none; min-height: 100vh; overflow-x: hidden; }

    @media (min-width: 1024px) {
      body { padding-bottom: 20px; padding-right: 240px; }
    }

    .wrapper { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .top-nav {
      position: sticky; top: 0;
      background: rgba(7, 9, 19, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 0; z-index: 1000;
    }
    .top-nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; cursor: pointer; }
    .brand-glow { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .nav-icons { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; color: var(--text-dim); transition: 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: #fff; }

    .search-panel { max-height: 0; overflow: visible; opacity: 0; position: relative; margin-bottom: 0; transition: all 0.3s ease; z-index: 5000; }
    .search-panel.active { max-height: 90px; opacity: 1; margin: 12px 0 20px 0; }
    .search-input-field {
      width: 100%; background: #131b2e;
      border: 1px solid var(--card-border); border-radius: 14px;
      padding: 13px 18px; color: #fff; font-size: 14px; outline: none;
    }
    .search-input-field:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    
    .search-results-floating {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: #101626; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; max-height: 320px; overflow-y: auto; z-index: 9999;
      display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }
    .search-entry { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--card-border); cursor: pointer; }
    .search-entry:hover { background: rgba(255,255,255,0.08); }
    .search-entry img { width: 40px; height: 55px; border-radius: 6px; object-fit: cover; background: #222; }

    .spotlight-card {
      position: relative; width: 100%; height: 320px;
      border-radius: 22px; overflow: hidden; margin: 16px 0 12px 0;
      border: 1px solid var(--card-border); cursor: pointer;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); background: #0c101c;
    }
    @media (min-width: 768px) { .spotlight-card { height: 380px; } }
    .spotlight-slide { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; display: flex; align-items: center; justify-content: space-between; padding: 24px; }
    .spotlight-slide.active { opacity: 1; pointer-events: auto; }
    
    .spotlight-bg-blur {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      filter: blur(25px) brightness(0.25); transform: scale(1.1); z-index: 1;
    }
    .spotlight-overlay-grad {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(7,9,19,0.9) 0%, rgba(7,9,19,0.6) 50%, rgba(7,9,19,0.9) 100%);
      z-index: 2;
    }
    .spotlight-poster-img {
      position: relative; z-index: 3; height: 85%; aspect-ratio: 2/3;
      border-radius: 14px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .spotlight-info-side {
      position: relative; z-index: 3; flex: 1; text-align: right; padding-right: 24px;
    }

    .badge-pill {
      background: var(--accent); color: #fff; font-size: 11px;
      font-weight: 800; padding: 4px 12px; border-radius: 20px;
      display: inline-block; box-shadow: 0 0 12px var(--accent-glow);
    }
    .spotlight-title { font-size: 26px; font-weight: 900; margin: 10px 0; color: #fff; }
    .spotlight-desc { font-size: 13px; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.6; max-width: 600px; }

    .slider-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .dots-indicator { display: flex; gap: 6px; }
    .d-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
    .d-dot.active { width: 22px; border-radius: 10px; background: var(--accent); }
    .btn-dice {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: #f1f5f9; font-size: 12px; font-weight: 700;
      padding: 7px 16px; border-radius: 20px; cursor: pointer;
    }

    .filter-pills-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .filter-pills-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-dim); padding: 8px 18px; border-radius: 12px;
      font-size: 12.5px; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }

    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 500px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
    @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(5, 1fr); gap: 20px; } }

    .media-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
    }
    .media-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.2); }
    .media-card:active { transform: scale(0.96); }
    .card-cover { position: relative; width: 100%; aspect-ratio: 2/3; background: #131929; }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-rate {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(0,0,0,0.85); color: #fbbf24;
      font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .card-meta-text { padding: 10px 10px; text-align: right; }
    .c-title { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }

    .view-container { display: none; }
    .view-container.active { display: block; }

    .etfarag-hero-wrap {
      position: relative;
      margin: -14px -16px 20px -16px;
      padding: 35px 16px 26px 16px;
      overflow: hidden;
    }
    .etfarag-backdrop-blur {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(32px) brightness(0.24);
      transform: scale(1.18); z-index: 1;
    }
    .etfarag-backdrop-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,9,19,0.3) 0%, var(--bg-base) 100%);
      z-index: 2;
    }
    .etfarag-content-flex {
      position: relative; z-index: 3;
      display: flex; gap: 24px; align-items: flex-start;
    }
    @media (max-width: 680px) {
      .etfarag-content-flex { flex-direction: column-reverse; align-items: center; text-align: center; }
    }
    
    .etfarag-poster-box {
      position: relative; width: 175px; min-width: 175px;
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.15);
    }
    @media (min-width: 768px) { .etfarag-poster-box { width: 220px; min-width: 220px; } }
    .etfarag-poster-box img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    
    .poster-quick-actions {
      display: flex; justify-content: center; gap: 12px; margin-top: 12px;
    }
    .circle-tool-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .circle-tool-btn:hover { background: var(--accent); }

    .etfarag-details-body { flex: 1; text-align: right; }
    @media (max-width: 680px) { .etfarag-details-body { text-align: center; } }

    .movie-headline-title { font-size: 28px; font-weight: 900; line-height: 1.3; margin-bottom: 6px; }
    .movie-headline-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; }

    .capsule-meta-tags {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    }
    @media (max-width: 680px) { .capsule-meta-tags { justify-content: center; } }
    .c-badge {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      color: #e2e8f0; display: inline-flex; align-items: center; gap: 5px;
    }
    .c-badge.gold { border-color: rgba(251, 191, 36, 0.5); color: #fbbf24; }

    .story-card-box {
      background: rgba(18, 24, 43, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
      text-align: right;
    }
    .story-section-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .story-paragraph { font-size: 14.5px; color: #e2e8f0; line-height: 1.9; font-weight: 400; }

    .series-episodes-section {
      background: transparent;
      margin-bottom: 28px; text-align: right;
      display: none;
    }
    .seasons-scroll-tabs {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none;
    }
    .seasons-scroll-tabs::-webkit-scrollbar { display: none; }
    .season-tab-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
      color: #94a3b8; padding: 9px 22px; border-radius: 24px;
      font-size: 13.5px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .season-tab-btn.active {
      background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow);
    }

    .episodes-list-layout {
      display: flex; flex-direction: column; gap: 10px; margin-top: 8px;
    }
    .etfarag-ep-card {
      background: rgba(18, 24, 43, 0.75); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: all 0.2s ease;
    }
    .etfarag-ep-card:hover {
      background: rgba(26, 35, 62, 0.85); border-color: rgba(255,255,255,0.18); transform: translateY(-1px);
    }
    .etfarag-ep-card.active-playing {
      border-color: var(--accent); background: rgba(139, 92, 246, 0.12);
    }
    .etfarag-ep-right {
      display: flex; align-items: center; gap: 14px; text-align: right;
    }
    .etfarag-ep-index {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      color: #93c5fd; font-size: 15px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .etfarag-ep-titles { display: flex; flex-direction: column; gap: 3px; }
    .ep-main-name { font-size: 14px; font-weight: 800; color: #f8fafc; }
    .ep-duration-tag { font-size: 11px; color: var(--text-dim); }
    
    .etfarag-ep-left-play {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(139, 92, 246, 0.18); border: 1px solid var(--accent);
      color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .etfarag-ep-card:hover .etfarag-ep-left-play {
      background: var(--accent); box-shadow: 0 0 12px var(--accent-glow);
    }

    .etfarag-play-btn {
      width: 100%; background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
      border: none; border-radius: 16px; padding: 16px; color: #fff;
      font-size: 15.5px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 25px var(--accent-glow); margin-bottom: 26px;
      transition: all 0.2s;
    }
    .etfarag-play-btn.busy-btn {
      opacity: 0.6; pointer-events: none; filter: grayscale(0.5);
    }

    .reviews-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 22px; margin-bottom: 28px; text-align: right;
    }
    .rating-stars-row {
      display: flex; justify-content: center; gap: 10px; margin: 12px 0 8px 0;
      font-size: 28px; cursor: pointer; direction: ltr;
    }
    .star-item { color: rgba(255,255,255,0.2); transition: color 0.2s, transform 0.2s; }
    .star-item.selected { color: #fbbf24; transform: scale(1.15); }
    .rating-feedback-text { text-align: center; font-size: 12px; color: #fbbf24; font-weight: 700; min-height: 18px; margin-bottom: 12px; }

    .comment-input-box {
      width: 100%; background: #0c101c; border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px; color: #fff; font-size: 13.5px;
      outline: none; resize: none; margin-bottom: 12px;
    }
    .btn-send-review {
      background: var(--accent); border: none;
      color: #fff; padding: 10px 24px; border-radius: 12px; font-size: 13px;
      font-weight: 800; cursor: pointer; float: left; box-shadow: 0 4px 14px var(--accent-glow);
    }

    .comments-stream { margin-top: 24px; border-top: 1px solid var(--card-border); padding-top: 18px; }
    .single-comment-item {
      display: flex; gap: 12px; margin-bottom: 14px; background: rgba(255,255,255,0.03);
      padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05);
    }
    .comment-user-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
    .comment-content { flex: 1; text-align: right; }
    .comment-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .comment-author { font-size: 13px; font-weight: 800; color: #f1f5f9; }
    .comment-date { font-size: 10.5px; color: var(--text-dim); }
    .comment-stars-display { font-size: 11px; color: #fbbf24; margin-bottom: 4px; }
    .comment-text-body { font-size: 13px; color: #cbd5e1; line-height: 1.6; }

    .similar-row-scroll {
      display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none;
    }
    .similar-row-scroll::-webkit-scrollbar { display: none; }
    .similar-mini-card {
      width: 130px; min-width: 130px; border-radius: 14px; overflow: hidden;
      background: var(--card-bg); border: 1px solid var(--card-border); cursor: pointer;
    }
    .similar-mini-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .similar-mini-card .s-txt { font-size: 11.5px; font-weight: 700; padding: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

    .profile-card-modern {
      background: linear-gradient(145deg, rgba(22, 30, 53, 0.85) 0%, rgba(13, 18, 33, 0.95) 100%);
      border: 1px solid var(--card-border); border-radius: 24px; padding: 20px;
      display: flex; align-items: center; justify-content: space-between; margin: 16px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .profile-user-left { display: flex; align-items: center; gap: 16px; }
    .user-avatar-wrap { position: relative; cursor: pointer; }
    .user-avatar-img-circle {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid var(--accent); object-fit: cover; display: block;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .avatar-edit-badge {
      position: absolute; bottom: -2px; right: -2px;
      background: var(--accent); color: #fff; width: 22px; height: 22px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 11px; border: 2px solid var(--bg-base);
    }
    .profile-name-title { font-size: 17px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
    .profile-id-sub { font-size: 11.5px; color: var(--text-dim); font-family: monospace; margin-top: 3px; }
    .btn-edit-name { font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 4px; display: inline-block; }

    .sec-block-title {
      font-size: 16px; font-weight: 900; margin: 24px 0 12px 0; text-align: right;
      display: flex; align-items: center; justify-content: space-between;
    }

    .history-card-box {
      background: rgba(18, 24, 43, 0.7); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 12px 16px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; transition: 0.2s;
    }
    .history-card-box:hover { border-color: var(--accent); background: rgba(26, 35, 62, 0.8); }
    .history-info-flex { display: flex; align-items: center; gap: 12px; text-align: right; }
    .history-thumb { width: 44px; height: 58px; border-radius: 8px; object-fit: cover; }
    .btn-resume-play {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 8px 14px; font-size: 12px; font-weight: 800; cursor: pointer;
    }

    .rewards-grid-box {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px;
    }
    .reward-box-item {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 14px; text-align: center;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .reward-cost-badge {
      display: inline-block; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 12px; margin: 4px 0 8px 0;
    }
    .reward-btn-action {
      background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
      color: #fff; font-size: 11.5px; font-weight: 800; padding: 7px; border-radius: 10px;
      cursor: pointer; transition: 0.2s;
    }
    .reward-btn-action:hover { background: var(--accent); border-color: var(--accent); }

    .links-list-group {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; overflow: hidden; margin-top: 8px;
    }
    .profile-link-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--card-border);
      cursor: pointer; font-size: 13.5px; font-weight: 800; transition: 0.2s;
    }
    .profile-link-row:last-child { border-bottom: none; }
    .profile-link-row:hover { background: rgba(255,255,255,0.04); }
    .profile-link-row .arrow-icon { color: var(--text-dim); font-size: 12px; }

    .capsule-navbar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 440px;
      background: rgba(14, 20, 36, 0.95); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border); border-radius: 28px;
      display: flex; justify-content: space-around; padding: 8px 10px;
      z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    @media (min-width: 1024px) {
      .capsule-navbar { display: none; }
    }
    .cap-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--text-dim);
      font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 10px;
    }
    .cap-btn.active { color: var(--accent); }

    .desktop-sidebar {
      display: none;
    }
    @media (min-width: 1024px) {
      .desktop-sidebar {
